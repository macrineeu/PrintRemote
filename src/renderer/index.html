<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Service Print</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--accent:#3b82f6}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #334155}
  h1{font-size:18px;margin:0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--err)}
  .dot.on{background:var(--ok)}
  main{padding:16px 20px;display:grid;gap:16px}
  .card{background:var(--card);border-radius:8px;padding:14px 16px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
  code{background:#0b1220;padding:2px 6px;border-radius:4px;font-size:13px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,button{background:#0b1220;color:var(--text);border:1px solid #334155;border-radius:6px;padding:6px 10px;font-size:13px}
  button{cursor:pointer;background:var(--accent);border-color:var(--accent)}
  button.ghost{background:transparent}
  #logs{height:320px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;background:#0b1220;border-radius:6px;padding:8px}
  .log{padding:2px 0}
  .log .t{color:var(--muted);margin-right:6px}
  .log.ok{color:var(--ok)}.log.warn{color:var(--warn)}.log.error{color:var(--err)}
  .log details{margin:2px 0 6px 0}
  .log summary{cursor:pointer;color:var(--muted);font-size:11px}
  .log pre{margin:4px 0 0 12px;padding:6px 8px;background:#111a2e;border-left:2px solid #334155;color:#cbd5e1;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>Service Print</h1>
  <span id="url" class="muted"></span>
</header>
<main>
  <div class="card">
    <h2>Status</h2>
    <div id="status" class="muted">carregando...</div>
    <div class="row" style="margin-top:8px">
      <button class="ghost" id="openConfig">Abrir config.json</button>
      <span class="muted" id="cfgPath"></span>
    </div>
  </div>

  <div class="card">
    <h2>Impressoras</h2>
    <div class="row">
      <select id="printers"></select>
      <button id="refresh" class="ghost">Atualizar</button>
      <button id="test">Imprimir teste</button>
    </div>
    <div id="testResult" class="muted" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2>Console <span class="muted" style="text-transform:none;letter-spacing:0">· clique em "payload" para expandir</span></h2>
    <div class="row" style="margin-bottom:8px">
      <label class="muted"><input type="checkbox" id="autoExpand"> expandir payloads automaticamente</label>
      <button class="ghost" id="clear">Limpar</button>
    </div>
    <div id="logs"></div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const escapeHtml = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function addLog(e) {
    const div = document.createElement('div');
    div.className = 'log ' + e.level;
    div.innerHTML = `<span class="t">${new Date(e.time).toLocaleTimeString()}</span>${escapeHtml(e.message)}`;
    if (e.data !== undefined) {
      const det = document.createElement('details');
      if ($('autoExpand').checked) det.open = true;
      det.innerHTML = `<summary>payload</summary><pre>${escapeHtml(JSON.stringify(e.data, null, 2))}</pre>`;
      div.appendChild(det);
    }
    $('logs').appendChild(div);
    $('logs').scrollTop = $('logs').scrollHeight;
  }

  async function loadStatus() {
    const s = await window.api.getStatus();
    $('dot').className = 'dot' + (s.running ? ' on' : '');
    $('url').textContent = s.url;
    $('status').innerHTML = s.running
      ? `Servidor rodando em <code>${s.url}</code> · token: ${s.tokenEnabled ? 'ativo' : 'desativado'} · impressora padrão: ${s.defaultPrinter || '(sistema)'}`
      : 'Servidor parado. Verifique a porta no config.json.';
    $('cfgPath').textContent = s.configPath;
    $('logs').innerHTML = '';
    s.logs.forEach(addLog);
  }

  async function loadPrinters() {
    const list = await window.api.getPrinters();
    const sel = $('printers');
    sel.innerHTML = '<option value="">(padrão do sistema)</option>';
    list.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.name;
      o.textContent = `${p.displayName || p.name} [${p.type || 'system'}]${p.description ? ' · ' + p.description : ''}${p.isDefault ? ' ★' : ''}`;
      sel.appendChild(o);
    });
  }

  $('refresh').onclick = loadPrinters;
  $('clear').onclick = async () => { await window.api.clearLogs(); $('logs').innerHTML = ''; };
  $('openConfig').onclick = () => window.api.openConfig();
  $('test').onclick = async () => {
    $('testResult').textContent = 'Enviando...';
    try {
      const r = await window.api.testPrint($('printers').value);
      $('testResult').textContent = 'OK: impresso em ' + r.printer;
    } catch (err) {
      $('testResult').textContent = 'Erro: ' + err.message;
    }
  };

  window.api.onLog(addLog);
  loadStatus();
  loadPrinters();
</script>
</body>
</html>
